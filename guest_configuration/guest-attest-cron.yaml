apiVersion: batch/v1
kind: CronJob
metadata:
  name: guest-attest
  namespace: kube-system
spec:
  schedule: '@daily'
  concurrencyPolicy: Forbid
  # startingDeadlineSeconds: # Don't define so job always runs on missing deadline
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: guest-attest
              container: guest-attest:0.2.0
              volumeMounts:
                - name: security
                  mountPath: /sys/kernel/security
                - name: tpm
                  mountPath: /dev/tpm0
                - name: nfd-features
                  mountPath: /nfd
              securityContext:
                privileged: true
          volumes:
            - name: security
              hostPath: /sys/kernel/security
            - name: tpm
              hostPath: /dev/tpm0
            - name: nfd-features
              hostPath: /etc/kubernetes/node-feature-discovery/features.d
              readOnly: false
