apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: guest-attest
  namespace: kube-system
spec:
  template:
    spec:
      restartPolicy: Always
      nodeSelector:
        kubernetes.azure.com/security-type: ConfidentialVM  # label given to CVM nodes by AKS
      containers:
        - name: guest-attest
          image: ghcr.io/alan-turing-institute/fridge-attestation:main
          volumeMounts:
            - name: security
              mountPath: /sys/kernel/security
            - name: tpm
              mountPath: /dev/tpm0
            - name: nfd-features
              mountPath: /nfd
          securityContext:
            privileged: true
      volumes:
        - name: security
          hostPath:
            path: /sys/kernel/security
        - name: tpm
          hostPath:
            path: /dev/tpm0
        - name: nfd-features
          hostPath:
            path: /etc/kubernetes/node-feature-discovery/features.d
          readOnly: false
