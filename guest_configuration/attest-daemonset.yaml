apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: guest-attest
  namespace: kube-system
spec:
  template:
    spec:
      restartPolicy: Always
      nodeSelector:
        kubernetes.azure.com/security-type: ConfidentialVM  # label given to CVM nodes by AKS
      containers:
        - name: guest-attest
          container: ghcr.io/alan-turing-institute/fridge-attestation:main
          volumeMounts:
            - name: security
              mountPath: /sys/kernel/security
            - name: tpm
              mountPath: /dev/tpm0
            - name: nfd-features
              mountPath: /nfd
          securityContext:
            privileged: true
          volumes:
            - name: security
              hostPath: /sys/kernel/security
            - name: tpm
              hostPath: /dev/tpm0
            - name: nfd-features
              hostPath: /etc/kubernetes/node-feature-discovery/features.d
              readOnly: false
